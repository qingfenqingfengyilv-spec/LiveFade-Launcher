
name: Build LiveFade Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "LiveFadeLauncher-Android-Project.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q LiveFadeLauncher-Android-Project.zip -d workspace
          test -f workspace/LiveFadeLauncher/app/build.gradle.kts

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p workspace/LiveFadeLauncher :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiveFadeLauncher-debug-apk
          path: workspace/LiveFadeLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
